# Phoebe dual-arm wall-avoidance scenario.
# Each arm starts at an IK-derived posture clear of the wall (y=±0.15) and
# is given a target *inside* the wall, so the CERG soft constraint activates.
# Postures and targets were generated by examples/phoebe/scripts/solve_ik_wall.py
# for the world position [0.7, 0, 1.25].

left_arm:
  joint_names:
    - left_ur_arm_shoulder_pan_joint
    - left_ur_arm_shoulder_lift_joint
    - left_ur_arm_elbow_joint
    - left_ur_arm_wrist_1_joint
    - left_ur_arm_wrist_2_joint
    - left_ur_arm_wrist_3_joint
  q0:       [-2.0734, -1.8849, -1.6024, -1.0681,  0.3770, -1.0681]
  q_target: [-2.3196, -2.9655, -1.3368,  0.2503,  0.4784, -1.6183]

right_arm:
  joint_names:
    - right_ur_arm_shoulder_pan_joint
    - right_ur_arm_shoulder_lift_joint
    - right_ur_arm_elbow_joint
    - right_ur_arm_wrist_1_joint
    - right_ur_arm_wrist_2_joint
    - right_ur_arm_wrist_3_joint
  q0:       [ 2.0106, -1.3194,  1.8538, -0.9420, -0.0628,  0.0000]
  q_target: [ 2.3227, -0.3204,  1.1638, -0.7448,  0.2556, -0.5023]
