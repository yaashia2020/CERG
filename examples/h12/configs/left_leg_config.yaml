# CERG configuration – H1_2 left leg (6 DOF)
# Joint order: hip_yaw, hip_pitch, hip_roll, knee, ankle_pitch, ankle_roll
#
# Legs bear the full body weight and use high-torque actuators (200-300 N·m),
# so gains are set substantially higher than the arms.

# ─── Controller gains ───
#              hip_yaw  hip_pitch  hip_roll  knee   ank_pitch  ank_roll
Kp: [150.0,   200.0,     150.0,   250.0,    40.0,      30.0]
Kd: [ 30.0,    40.0,      30.0,    50.0,    10.0,       8.0]

# ─── Joint position limits [rad] ───
#                hip_yaw   hip_pitch  hip_roll  knee     ank_pitch   ank_roll
q_min: [        -0.43,    -3.14,     -0.43,   -0.12,   -0.8973,    -0.2618]
q_max: [         0.43,     2.50,      3.14,    2.19,    0.5236,      0.2618]

# ─── Joint velocity limits [rad/s] ───
dq_max: [23.0, 23.0, 23.0, 14.0, 9.0, 9.0]

# ─── Joint torque limits [N·m] ───
tau_max: [200.0, 200.0, 200.0, 300.0, 60.0, 40.0]

# ─── CERG prediction ───
prediction_dt: 0.02
prediction_horizon: 0.2
erg_dt: 0.005

# ─── Navigation field ───
eta: 0.005
zeta_q: 0.15
delta_q: 0.1
delta_s: 0.1
fd: 1.0
zeta_w: 0.15
delta_w: 0.1

# ─── DSM robustness margins ───
robust_delta_tau: 0.0
robust_delta_q: 0.0
robust_delta_dq: 0.0

# ─── DSM scaling factors ───
kappa_tau: 1.0
kappa_q: 1.0
kappa_dq: 1.0
kappa_soft: 1.0
kappa_hard: 1.0
kappa_energy: 1.0

# ─── Energy constraint ───
E_max: 15.0
